<style>
:root {
  --bg: #0A0D0B; --panel: #10140F; --panel-alt: #0D110D;
  --border: #1E2A21; --border-soft: #172018;
  --text-primary: #DCE7DE; --text-dim: #6F8177; --text-faint: #48564C;
  --green: #4ADE80; --green-dim: #2F8F5A; --amber: #F5A623; --red: #F0453A; --blue: #38BDF8;
  --font-mono: 'JetBrains Mono', monospace; --font-sans: 'Inter', sans-serif;
  --shadow-panel: 0 2px 10px rgba(0,0,0,0.35);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text-primary); font-family: var(--font-sans); min-height: 100vh; font-size: 14px; }
.topbar { display: flex; align-items: center; gap: 16px; padding: 10px 20px; border-bottom: 1px solid var(--border); background: var(--panel-alt); position: sticky; top: 0; z-index: 20; }
.brand { display: flex; align-items: center; gap: 9px; }
.brand-logo { width: 26px; height: 26px; display: block; }
.brand-name { font-family: var(--font-mono); font-weight: 700; font-size: 16px; letter-spacing: 1.5px; }
.brand-sub { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); letter-spacing: 2px; }
.back-link { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); text-decoration: none; border: 1px solid var(--border); border-radius: 4px; padding: 6px 11px; margin-left: auto; }
.back-link:hover { color: var(--green); border-color: var(--green-dim); }
.clock { font-family: var(--font-mono); font-size: 12px; color: var(--text-faint); }

.wrap { padding: 18px; max-width: 1400px; margin: 0 auto; }

.metric-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 16px; }
.metric-tile { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 16px 18px; box-shadow: var(--shadow-panel); }
.metric-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 1.5px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 8px; }
.metric-value { font-family: var(--font-mono); font-size: 30px; font-weight: 700; color: var(--text-primary); }
.metric-value.blue { color: var(--blue); } .metric-value.red { color: var(--red); } .metric-value.green { color: var(--green); }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
.grid3 { display: grid; grid-template-columns: 1.3fr 1fr; gap: 14px; }

.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 16px; box-shadow: var(--shadow-panel); }
.panel h2 { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 1.8px; text-transform: uppercase; color: var(--text-dim); margin: 0 0 14px 0; font-weight: 600; padding-bottom: 9px; border-bottom: 1px solid var(--border-soft); }
.chart-box { position: relative; height: 220px; }
.chart-box.tall { height: 340px; }

.catch-table { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 11px; }
.catch-table th { text-align: left; color: var(--text-faint); font-weight: 600; font-size: 9.5px; letter-spacing: 1px; padding: 6px 8px; border-bottom: 1px solid var(--border-soft); }
.catch-table td { padding: 7px 8px; border-bottom: 1px solid var(--border-soft); color: var(--text-dim); }
.catch-table td.label { color: var(--text-primary); font-weight: 600; }
.catch-table td.pts { color: var(--green); text-align: right; }
.catch-table .empty-row td { text-align: center; color: var(--text-faint); padding: 24px; }

@media (max-width: 1100px) {
  .metric-row { grid-template-columns: repeat(2, 1fr); }
  .grid2, .grid3 { grid-template-columns: 1fr; }
}
</style>
</head>

    <span class="brand-name">QUARRY</span>
    <span class="brand-sub">ANALYTICS</span>
  </div>
  <a href="/" class="back-link" target="quarry_mission_control" rel="noopener">← MISSION CONTROL</a>
  <div class="clock" id="clock">--:--:--</div>
</header>

<div class="wrap">

  <div class="metric-row">
    <div class="metric-tile">
      <div class="metric-label">Confirmed Catches</div>
      <div class="metric-value green" id="m-catches">--</div>
    </div>
    <div class="metric-tile">
      <div class="metric-label">Active Sites</div>
      <div class="metric-value" id="m-sites">--</div>
    </div>
    <div class="metric-tile">
      <div class="metric-label">Players Online</div>
      <div class="metric-value" id="m-players">--</div>
    </div>
    <div class="metric-tile">
      <div class="metric-label">Total Points Awarded</div>
      <div class="metric-value blue" id="m-points">--</div>
    </div>
  </div>

  <div class="grid2">
    <div class="panel">
      <h2>Team Score Comparison</h2>
      <div class="chart-box"><canvas id="chart-teams"></canvas></div>
    </div>
    <div class="panel">
      <h2>Top Hunters</h2>
      <div class="chart-box"><canvas id="chart-hunters"></canvas></div>
    </div>
  </div>

  <div class="grid3">
    <div class="panel">
      <h2>Recent Confirmed Catches</h2>
      <table class="catch-table">
        <thead><tr><th>Target</th><th>Site</th><th>Confirmed By</th><th>Time</th><th style="text-align:right;">Points</th></tr></thead>
        <tbody id="catch-rows"><tr class="empty-row"><td colspan="5">No confirmed catches yet.</td></tr></tbody>
      </table>
    </div>
    <div class="panel">
      <h2>Catch Value Distribution</h2>
      <div class="chart-box"><canvas id="chart-distribution"></canvas></div>
    </div>
  </div>

</div>

<script>
setInterval(() => { document.getElementById("clock").textContent = new Date().toLocaleTimeString("en-GB"); }, 1000);

const GENERIC_POINTS_THRESHOLD = 10; // matches backend GENERIC_DETECTION_POINTS

let teamsChart, huntersChart, distChart;

function initCharts() {
  const fontColor = "#6F8177";
  Chart.defaults.color = fontColor;
  Chart.defaults.font.family = "JetBrains Mono, monospace";
  Chart.defaults.font.size = 10;

  teamsChart = new Chart(document.getElementById("chart-teams"), {
    type: "bar",
    data: { labels: ["Team Alpha", "Team Bravo"], datasets: [{ data: [0, 0], backgroundColor: ["#38BDF8", "#F0453A"], borderRadius: 3 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
      scales: { y: { beginAtZero: true, grid: { color: "#172018" } }, x: { grid: { display: false } } } },
  });

  huntersChart = new Chart(document.getElementById("chart-hunters"), {
    type: "bar",
    data: { labels: [], datasets: [{ data: [], backgroundColor: "#4ADE80", borderRadius: 3 }] },
    options: { indexAxis: "y", responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
      scales: { x: { beginAtZero: true, grid: { color: "#172018" } }, y: { grid: { display: false } } } },
  });

  distChart = new Chart(document.getElementById("chart-distribution"), {
    type: "doughnut",
    data: { labels: ["Registered targets", "Generic sightings"], datasets: [{ data: [0, 0], backgroundColor: ["#4ADE80", "#F5A623"], borderWidth: 0 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: "bottom", labels: { boxWidth: 10, padding: 12 } } } },
  });
}

function timeAgo(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString("en-GB");
}

async function refresh() {
  let state;
  try {
    const res = await fetch("/api/state");
    state = await res.json();
  } catch (e) {
    return; // backend not reachable this tick -- try again next interval
  }

  const sites = state.sites || {};
  const players = state.players || [];
  const teamScores = state.team_scores || [];
  const leaderboard = state.leaderboard || [];
  const bountyLog = state.bounty_log || []; // requires the one-line backend addition

  document.getElementById("m-sites").textContent = Object.keys(sites).length;
  document.getElementById("m-players").textContent = players.length;
  document.getElementById("m-catches").textContent = bountyLog.length;
  document.getElementById("m-points").textContent = leaderboard.reduce((sum, e) => sum + e.score, 0);

  const alpha = teamScores.find((t) => t.team === "Alpha")?.score ?? 0;
  const bravo = teamScores.find((t) => t.team === "Bravo")?.score ?? 0;
  teamsChart.data.datasets[0].data = [alpha, bravo];
  teamsChart.update("none");

  const topHunters = leaderboard.slice(0, 8);
  huntersChart.data.labels = topHunters.map((h) => h.name);
  huntersChart.data.datasets[0].data = topHunters.map((h) => h.score);
  huntersChart.update("none");

  const registered = bountyLog.filter((e) => (e.points || 0) > GENERIC_POINTS_THRESHOLD).length;
  const generic = bountyLog.length - registered;
  distChart.data.datasets[0].data = [registered, generic];
  distChart.update("none");

  const rows = document.getElementById("catch-rows");
  if (bountyLog.length === 0) {
    rows.innerHTML = `<tr class="empty-row"><td colspan="5">No confirmed catches yet.</td></tr>`;
  } else {
    rows.innerHTML = bountyLog.slice(0, 15).map((e) => `
      <tr>
        <td class="label">${e.label}</td>
        <td>${sites[e.site_id]?.owner || e.site_id}</td>
        <td>${(e.contributors || []).join(", ")}</td>
        <td>${timeAgo(e.timestamp)}</td>
        <td class="pts">+${e.points}</td>
      </tr>
    `).join("");
  }
}

initCharts();
refresh();
setInterval(refresh, 4000);
</script>
