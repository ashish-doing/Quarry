name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Hub + safety-edge-case tests
        env:
          # Hub tests use FastAPI's TestClient against in-process
          # WebSocket connections -- no real Cyberwave/robot credentials
          # needed. If any test starts requiring them, that's a sign
          # it's testing the wrong layer (integration, not unit).
          CYBERWAVE_API_KEY: "ci-placeholder-not-used"
        run: |
          python -m pytest backend/test_multisite.py backend/test_dispute_and_safety_edge_cases.py -v