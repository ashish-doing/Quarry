name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Hub contract script
        env:
          CYBERWAVE_API_KEY: "ci-placeholder-not-used"
        run: |
          python -m backend.test_multisite

      - name: Run safety-edge-case tests (pytest)
        env:
          CYBERWAVE_API_KEY: "ci-placeholder-not-used"
        run: |
          python -m pytest backend/test_dispute_and_safety_edge_cases.py -v

      - name: Run nav math tests (pytest)
        run: |
          python -m pytest backend/test_nav_math.py -v

      - name: Run sequential survey component tests (pytest)
        run: |
          python -m pytest backend/test_sequential_survey_components.py -v  